# NIBE F370: price and comfort optimisation (DRAFT, DISABLED)
#
# Every automation here has `initial_state: false`, so nothing writes to the
# heat pump until you turn it on yourself. When you enable one for good,
# delete its `initial_state` line too. Otherwise it switches off again after
# every Home Assistant restart.
#
# Prerequisites: Gate E passed (7 days of verified read-only data),
# nibe_f370_monitoring.yaml installed, the relevant Nibe Local Easyconf
# entities enabled.
#
# Placeholders to replace (search-and-replace):
#   sensor.nord_pool_se3_current_price -> core Nord Pool current price (SEK/kWh)
#   sensor.nord_pool_se3_daily_average -> core Nord Pool daily average (SEK/kWh)
#   number.nibe_heat_offset_s1         -> Heat Offset S1            (47011)
#   select.nibe_hot_water_comfort_mode -> Hot water comfort mode    (47041)
#   select.nibe_temporary_lux          -> Temporary Lux             (48132)
#   select.nibe_fan_mode               -> Fan Mode                  (47260)
#   sensor.nibe_bt1_outdoor            -> BT1 Outdoor Temperature   (40004)
#   sensor.nibe_bt7_hw_top             -> BT7 HW Top                (40013)
#   sensor.room_*                      -> your Zigbee room sensors
#   sensor.bathroom_humidity           -> bathroom humidity sensor
#
# Select option labels follow the nibe register map ("Economy", "Normal",
# "Luxury", "One time increase", "Normal", "Fan mode 2" ...). Check them
# against your entities' actual options before enabling.

input_number:
  nibe_cheap_ratio:
    name: "NIBE cheap threshold (x daily average)"
    min: 0.5
    max: 1.0
    step: 0.05
    initial: 0.8
  nibe_expensive_ratio:
    name: "NIBE expensive threshold (x daily average)"
    min: 1.05
    max: 2.0
    step: 0.05
    initial: 1.3
  nibe_min_comfort_temp:
    name: "NIBE minimum comfort temperature"
    min: 18
    max: 23
    step: 0.5
    unit_of_measurement: "°C"
    initial: 20.5
  nibe_max_comfort_temp:
    name: "NIBE maximum comfort temperature"
    min: 20
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    initial: 22.0

template:
  - sensor:
      - name: "NIBE price level"
        unique_id: nibe_price_level
        icon: mdi:cash-clock
        state: >
          {% set p = states('sensor.nord_pool_se3_current_price') | float(none) %}
          {% set avg = states('sensor.nord_pool_se3_daily_average') | float(none) %}
          {% if p is none or avg is none or avg <= 0 %}
            unknown
          {% elif p <= avg * states('input_number.nibe_cheap_ratio') | float(0.8) or p <= 0.30 %}
            cheap
          {% elif p >= avg * states('input_number.nibe_expensive_ratio') | float(1.3) and p >= 1.00 %}
            expensive
          {% else %}
            normal
          {% endif %}

      - name: "House mean temperature"
        unique_id: house_mean_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        # Replace with your living-space sensors.
        state: >
          {% set s = ['sensor.room_living_temperature',
                      'sensor.room_kitchen_temperature',
                      'sensor.room_bedroom_temperature']
                     | select('has_value') | map('states') | map('float') | list %}
          {{ (s | sum / s | count) | round(1) if s | count > 0 else none }}
        availability: >
          {{ ['sensor.room_living_temperature', 'sensor.room_kitchen_temperature',
              'sensor.room_bedroom_temperature'] | select('has_value') | list | count > 0 }}

automation:
  # ---- Heating: price-based heat offset (47011), bounded -1..+1 ----------
  - id: nibe_f370_price_heat_offset
    alias: "NIBE: price-based heat offset"
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.nibe_price_level
        for: "00:15:00"
    condition:
      - condition: template
        value_template: "{{ states('sensor.nibe_price_level') in ['cheap', 'normal', 'expensive'] }}"
      - condition: template
        value_template: "{{ has_value('number.nibe_heat_offset_s1') }}"
      # At most one write per hour.
      - condition: template
        value_template: >
          {{ (now() - states.number.nibe_heat_offset_s1.last_changed).total_seconds() > 3600 }}
    action:
      - variables:
          level: "{{ states('sensor.nibe_price_level') }}"
          mean: "{{ states('sensor.house_mean_temperature') | float(21) }}"
          outdoor: "{{ states('sensor.nibe_bt1_outdoor') | float(0) }}"
          el_add: "{{ is_state('binary_sensor.nibe_f370_electric_addition_active', 'on') }}"
          target: >
            {% if level == 'cheap' and mean < states('input_number.nibe_max_comfort_temp') | float(22) %}
              1
            {% elif level == 'expensive' and mean > states('input_number.nibe_min_comfort_temp') | float(20.5)
                    and outdoor > -10 and not el_add %}
              -1
            {% else %}
              0
            {% endif %}
      - condition: template
        value_template: "{{ states('number.nibe_heat_offset_s1') | int(0) != target | int }}"
      - service: number.set_value
        target:
          entity_id: number.nibe_heat_offset_s1
        data:
          value: "{{ [[target | int, -2] | max, 2] | min }}"

  # ---- Hot water: Economy when expensive, Normal otherwise ---------------
  - id: nibe_f370_price_hot_water
    alias: "NIBE: price-based hot water mode"
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.nibe_price_level
        for: "00:15:00"
    condition:
      - condition: template
        value_template: "{{ has_value('select.nibe_hot_water_comfort_mode') }}"
    action:
      - variables:
          want: >
            {% if is_state('sensor.nibe_price_level', 'expensive')
                  and states('sensor.nibe_bt7_hw_top') | float(0) >= 40 %}
              Economy
            {% else %}
              Normal
            {% endif %}
      - condition: template
        value_template: "{{ states('select.nibe_hot_water_comfort_mode') != want }}"
      - service: select.select_option
        target:
          entity_id: select.nibe_hot_water_comfort_mode
        data:
          option: "{{ want }}"

  # ---- Hot water: one-time boost in the cheap night window --------------
  - id: nibe_f370_cheap_hot_water_boost
    alias: "NIBE: one-time hot water boost when cheap at night"
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.nibe_price_level
        to: "cheap"
        for: "00:15:00"
    condition:
      - condition: time
        after: "00:00:00"
        before: "06:00:00"
      - condition: state
        entity_id: binary_sensor.nibe_f370_electric_addition_active
        state: "off"
      - condition: template
        value_template: "{{ states('sensor.nibe_bt7_hw_top') | float(99) < 50 }}"
    action:
      - service: select.select_option
        target:
          entity_id: select.nibe_temporary_lux
        data:
          option: "One time increase"

  # ---- Ventilation: temporary boost on shower humidity ------------------
  - id: nibe_f370_humidity_fan_boost
    alias: "NIBE: humidity fan boost"
    initial_state: false
    mode: restart
    trigger:
      - platform: numeric_state
        entity_id: sensor.bathroom_humidity
        above: 75
    action:
      - service: select.select_option
        target:
          entity_id: select.nibe_fan_mode
        data:
          option: "Fan mode 2"
      - wait_for_trigger:
          - platform: numeric_state
            entity_id: sensor.bathroom_humidity
            below: 60
        timeout: "01:00:00"
      - service: select.select_option
        target:
          entity_id: select.nibe_fan_mode
        data:
          option: "Normal"

  # ---- Watchdog: back to NIBE defaults when inputs are missing ----------
  - id: nibe_f370_watchdog_defaults
    alias: "NIBE: watchdog reset to defaults"
    initial_state: false
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: sensor.nibe_price_level
        to: "unknown"
        for: "00:30:00"
      - platform: state
        entity_id: binary_sensor.nibe_f370_electric_addition_active
        to: "on"
        for: "00:10:00"
    action:
      - delay: "00:02:00"   # let integrations come up after a restart
      - if:
          - condition: template
            value_template: "{{ states('number.nibe_heat_offset_s1') | int(0) < 0 }}"
        then:
          - service: number.set_value
            target:
              entity_id: number.nibe_heat_offset_s1
            data:
              value: 0
      - if:
          - condition: state
            entity_id: select.nibe_hot_water_comfort_mode
            state: "Economy"
        then:
          - service: select.select_option
            target:
              entity_id: select.nibe_hot_water_comfort_mode
            data:
              option: "Normal"
